name: delivery-check

on:
  push:
  pull_request:

jobs:
  delivery-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check
        run: |
          python3 -m py_compile integration/api_server.py
          python3 -m py_compile nv_json_mutator.py
          python3 -m py_compile scripts/compute_security_score.py scripts/analyze_seed_quality.py

      - name: Lightweight API smoke
        run: python3 scripts/smoke_api_server.py

      - name: Config validation
        run: python3 scripts/validate_project_configs.py

      - name: Install pytest
        run: python3 -m pip install --disable-pip-version-check --no-input pytest

      - name: Task4 release contract tests (unittest)
        run: >
          python3 -m unittest
          tests/test_project_configs.py
          tests/test_secret_scan.py
          tests/test_alfresco_bounded_protocol.py

      - name: Task4 release contract tests (pytest)
        run: >
          python3 -m pytest -q
          tests/test_content_update_contract_repair.py
          tests/test_multipart_upload_contract_repair.py
          tests/test_task4_clean_room_repair.py
          tests/test_r35_manifest_seed_representation.py
          tests/test_r35_http_envelope_repair.py
          tests/test_r35_c_validation_complete.py

      - name: Delivery preflight checks
        run: python3 scripts/delivery_preflight_check.py
