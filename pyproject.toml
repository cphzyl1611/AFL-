[build-system]
requires = ["setuptools>=61"]
build-backend = "deep2fuzz_build_backend"
backend-path = ["."]

[project]
name = "deep2fuzz-es"
dynamic = ["version"]
description = "Deep2Fuzz-ES platform adapter system"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
live = ["requests==2.32.4"]
model = ["numpy>=1.24", "pandas>=2.0", "torch>=2.0"]
analysis = ["pandas>=2.0", "matplotlib>=3.7"]

[project.scripts]
deep2fuzz = "deep2fuzz_cli:main"

[tool.setuptools.dynamic]
version = {attr = "deep2fuzz_version.__version__"}

[tool.setuptools]
py-modules = [
  "deep2fuzz_cli",
  "deep2fuzz_version",
  "deep2fuzz_provenance",
  "deep2fuzz_portability",
  "nv_json_mutator",
  "nv_url_query",
]

[tool.setuptools.packages.find]
include = ["integration*", "model_stage*", "deep2fuzz_evidence*", "deep2fuzz_config*", "deep2fuzz_runtime*"]

[tool.setuptools.package-data]
deep2fuzz_runtime = ["assets/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]
